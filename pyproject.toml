[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgwitness"
version = "0.1.0"
description = "Check Parquet row-group statistics against unfiltered decoded values"
requires-python = ">=3.10"
dependencies = ["pyarrow>=25.0.1,<26"]
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
rgwitness = "rgwitness.__main__:main"

[tool.setuptools.packages.find]
include = ["rgwitness*"]
